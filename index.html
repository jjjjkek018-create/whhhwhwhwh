<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do You See...? Quiz!</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: #e8f8f5;
            color: #2c3e50;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }

        .legend {
            background: #ffffff;
            border: 3px dashed #16a085;
            border-radius: 15px;
            padding: 12px 15px;
            width: 95%;
            max-width: 700px;
            text-align: center;
            font-size: 1.25rem;
            margin-bottom: 15px;
            color: #2c3e50;
            box-shadow: 5px 5px 0px rgba(22, 160, 133, 0.2);
            line-height: 1.5;
        }

        .word-q {
            color: #2980b9;
            font-weight: bold;
        }

        .word-yes {
            color: #27ae60;
            font-weight: bold;
        }

        .word-no {
            color: #e74c3c;
            font-weight: bold;
        }

        .header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 700px;
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: #d35400;
        }

        .stars {
            color: #f1c40f;
            text-shadow: 1px 1px 0px #d35400;
        }

        .card {
            background: #ffffff;
            border: 5px solid #16a085;
            border-radius: 25px;
            padding: 25px 30px;
            width: 95%;
            max-width: 700px;
            box-shadow: 10px 10px 0px #117a65;
            text-align: center;
        }

        .scene-box {
            background-color: #fef9e7;
            border: 4px solid #f1c40f;
            border-radius: 20px;
            padding: 25px 15px;
            margin-bottom: 25px;
            font-size: 4rem;
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .question {
            font-size: 2.1rem;
            margin-bottom: 25px;
            color: #2c3e50;
            font-weight: bold;
            line-height: 1.3;
        }

        .ukr-hint {
            font-size: 1.2rem;
            color: #7f8c8d;
            display: block;
            margin-top: 6px;
            font-weight: normal;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-btn {
            border: 4px dashed #bdc3c7;
            border-radius: 20px;
            padding: 18px 20px;
            cursor: pointer;
            background-color: #f8f9fa;
            font-family: inherit;
            font-size: 1.6rem;
            font-weight: bold;
            color: #2c3e50;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .option-btn:hover {
            border-color: #16a085;
            background-color: #e8f8f5;
            transform: scale(1.02);
        }

        .correct {
            background-color: #2ecc71 !important;
            border-color: #27ae60 !important;
            border-style: solid !important;
            color: white !important;
        }

        .wrong {
            background-color: #e74c3c !important;
            border-color: #c0392b !important;
            border-style: solid !important;
            color: white !important;
            animation: shake 0.4s;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
            100% { transform: translateX(0); }
        }

        .pop-in {
            animation: pop 0.3s ease-out;
        }

        @keyframes pop {
            0% { transform: scale(0.88); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .result-screen {
            display: none;
            text-align: center;
        }

        .result-screen h2 {
            font-size: 3rem;
            color: #16a085;
        }

        .restart-btn {
            font-family: inherit;
            font-size: 1.8rem;
            padding: 15px 30px;
            margin-top: 20px;
            border: 4px solid #117a65;
            border-radius: 15px;
            background-color: #16a085;
            color: white;
            cursor: pointer;
            box-shadow: 0px 6px 0px #0e6251;
        }

        .restart-btn:active {
            transform: translateY(6px);
            box-shadow: 0px 0px 0px #0e6251;
        }
    </style>
</head>
<body>

    <div class="legend">
        <span class="word-q">👉 👁️ ❓ = Do you see...? (Ти бачиш...?)</span><br>
        <span class="word-yes">✅ 👤 👁️ = Yes, I see...</span> &nbsp;|&nbsp;
        <span class="word-no">❌ 👤 ❌👁️ = No, I don't see...</span>
    </div>

    <div class="header">
        <div id="progress">Question 1 / 10</div>
        <div class="stars" id="stars-display">⭐ 0</div>
    </div>

    <div class="card" id="quiz-card">
        <div class="scene-box" id="scene-box"></div>
        <div class="question" id="question-text"></div>
        <div class="options-container" id="options-container"></div>
    </div>

    <div class="card result-screen" id="result-screen">
        <h2 id="result-title">Awesome!</h2>
        <div style="font-size: 4rem; margin: 20px 0;">🕵️‍♀️🌈🦄</div>
        <p id="result-text" style="font-size: 1.5rem;"></p>
        <button class="restart-btn" onclick="startGame()">Play Again! 🔄</button>
    </div>

    <script>
        const questions = [
            {
                scene: ["🦄", "🌻", "🌈"],
                target: "a unicorn",
                ukrainian: "(Ти бачиш єдинорога?)",
                isPresent: true
            },
            {
                scene: ["🤖", "🏰", "🦋"],
                target: "a dinosaur",
                ukrainian: "(Ти бачиш динозавра?)",
                isPresent: false
            },
            {
                scene: ["🧸", "🌻", "👸"],
                target: "a flower",
                ukrainian: "(Ти бачиш квітку?)",
                isPresent: true
            },
            {
                scene: ["🦄", "✨", "🦖"],
                target: "a teddy bear",
                ukrainian: "(Ти бачиш ведмедика?)",
                isPresent: false
            },
            {
                scene: ["🌈", "🤖", "🏰"],
                target: "a robot",
                ukrainian: "(Ти бачиш робота?)",
                isPresent: true
            },
            {
                scene: ["🦋", "🧸", "🌻"],
                target: "magic",
                ukrainian: "(Ти бачиш магію?)",
                isPresent: false
            },
            {
                scene: ["👸", "🏰", "✨"],
                target: "a princess",
                ukrainian: "(Ти бачиш принцесу?)",
                isPresent: true
            },
            {
                scene: ["🦖", "🤖", "🌈"],
                target: "a butterfly",
                ukrainian: "(Ти бачиш метелика?)",
                isPresent: false
            },
            {
                scene: ["🌈", "🦄", "🦋"],
                target: "a rainbow",
                ukrainian: "(Ти бачиш веселку?)",
                isPresent: true
            },
            {
                scene: ["🧸", "👸", "🌻"],
                target: "a castle",
                ukrainian: "(Ти бачиш замок?)",
                isPresent: false
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let canClick = true;
        let shuffledQuestions = [];

        const sceneBox = document.getElementById('scene-box');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const progressText = document.getElementById('progress');
        const starsDisplay = document.getElementById('stars-display');
        const quizCard = document.getElementById('quiz-card');
        const resultScreen = document.getElementById('result-screen');

        function startGame() {
            shuffledQuestions = [...questions];
            for (let i = shuffledQuestions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffledQuestions[i], shuffledQuestions[j]] = [shuffledQuestions[j], shuffledQuestions[i]];
            }

            currentQuestion = 0;
            score = 0;
            quizCard.style.display = 'block';
            resultScreen.style.display = 'none';
            quizCard.classList.remove('pop-in');
            void quizCard.offsetWidth;
            quizCard.classList.add('pop-in');
            loadQuestion();
        }

        function loadQuestion() {
            canClick = true;
            const q = shuffledQuestions[currentQuestion];

            progressText.innerText = `Question ${currentQuestion + 1} / ${shuffledQuestions.length}`;
            starsDisplay.innerText = `⭐ ${score}`;

            sceneBox.innerHTML = q.scene.map(emoji => `<span>${emoji}</span>`).join('');
            sceneBox.classList.remove('pop-in');
            void sceneBox.offsetWidth;
            sceneBox.classList.add('pop-in');

            questionText.innerHTML = `Do you <span class="word-q">see</span> ${q.target}?<span class="ukr-hint">${q.ukrainian}</span>`;

            optionsContainer.innerHTML = '';

            const yesBtn = document.createElement('button');
            yesBtn.className = 'option-btn pop-in';
            yesBtn.innerHTML = `✅ Yes, I see ${q.target}.`;
            yesBtn.onclick = () => checkAnswer(true, q.isPresent, yesBtn, noBtn);

            const noBtn = document.createElement('button');
            noBtn.className = 'option-btn pop-in';
            noBtn.innerHTML = `❌ No, I don't see ${q.target}.`;
            noBtn.onclick = () => checkAnswer(false, q.isPresent, noBtn, yesBtn);

            if (Math.random() < 0.5) {
                optionsContainer.appendChild(yesBtn);
                optionsContainer.appendChild(noBtn);
            } else {
                optionsContainer.appendChild(noBtn);
                optionsContainer.appendChild(yesBtn);
            }
        }

        function checkAnswer(selectedYes, isPresent, clickedBtn, otherBtn) {
            if (!canClick) return;
            canClick = false;

            if (selectedYes === isPresent) {
                clickedBtn.classList.add('correct');
                score++;
                starsDisplay.innerText = `⭐ ${score}`;
                playSound(800, 0.15);
                setTimeout(() => {
                    nextQuestion();
                }, 900);
            } else {
                clickedBtn.classList.add('wrong');
                playSound(150, 0.3);
                setTimeout(() => {
                    otherBtn.classList.add('correct');
                }, 300);
                setTimeout(() => {
                    nextQuestion();
                }, 2000);
            }
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < shuffledQuestions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            quizCard.style.display = 'none';
            resultScreen.style.display = 'block';
            resultScreen.classList.add('pop-in');

            document.getElementById('result-text').innerText = `You got ${score} out of ${shuffledQuestions.length} right!`;

            if (score === shuffledQuestions.length) {
                document.getElementById('result-title').innerText = "PERFECT SCORE! 👑";
            } else if (score >= 7) {
                document.getElementById('result-title').innerText = "Great job! 🌟";
            } else {
                document.getElementById('result-title').innerText = "Good try! Let's play again! 💪";
            }
        }

        function playSound(freq, duration) {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = freq > 400 ? 'sine' : 'square';
                osc.frequency.value = freq;
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + duration);
                osc.stop(ctx.currentTime + duration);
            } catch (e) {}
        }

        startGame();
    </script>
</body>
</html>
